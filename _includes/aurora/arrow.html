{%- comment -%} Thin arrow icon for square buttons. Param: dir = left | right | out {%- endcomment -%}
{%- case include.dir -%}
{%- when "left" -%}<svg class="a-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M14 8H2.5M7 3.5 2.5 8 7 12.5"/></svg>
{%- when "right" -%}<svg class="a-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M2 8h11.5M9 3.5 13.5 8 9 12.5"/></svg>
{%- else -%}<svg class="a-arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M3.5 12.5 12.5 3.5M5 3.5h7.5V11"/></svg>
{%- endcase -%}
